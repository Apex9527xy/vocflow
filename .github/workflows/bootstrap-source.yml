name: Bootstrap source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download source bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download source-bootstrap -p vocflow-2.9.13.bundle
      - name: Import and publish source
        run: |
          git fetch ./vocflow-2.9.13.bundle refs/heads/main:refs/remotes/source/main --force
          git push --force origin refs/remotes/source/main:refs/heads/main
