name: Bootstrap source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download source bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download source-bootstrap -p vocflow-2.9.13.bundle
      - name: Import source without changing workflow files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch ./vocflow-2.9.13.bundle refs/heads/main:refs/remotes/source/main --force
          git checkout refs/remotes/source/main -- .
          git checkout "$GITHUB_SHA" -- .github/workflows
          git rm -f .github/workflows/pages.yml .github/workflows/release.yml
          git add -A
          git commit -m "Release VocFlow 2.9.13 source"
      - name: Publish source
        run: git push origin HEAD:main
