name: Build and publish VocFlow release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  VOCFLOW_CLOUD_URL: ${{ vars.VOCFLOW_CLOUD_URL || 'https://api.vocflow.cc.cd' }}
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            pnpm install --frozen-lockfile
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 10 }
          }
          exit 1

      - name: Verify tag and cloud endpoint
        shell: pwsh
        run: |
          if (-not $env:VOCFLOW_CLOUD_URL) { throw 'Repository variable VOCFLOW_CLOUD_URL is required.' }
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$((Get-Content package.json -Raw | ConvertFrom-Json).version)" }
          node scripts/verify-release-version.cjs $tag

      - name: Build Windows installer and update package
        run: |
          pnpm run dist:user:nsis
          pnpm run package:update

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          if-no-files-found: error
          path: |
            release/user-nsis/*-Setup.exe
            release/user-nsis/*-Setup.exe.sha256
            release/*-update.zip
            release/*-update.zip.sha256
            release/update.json

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "$sdkmanager_path" ]; then
            echo "Unable to locate sdkmanager under $ANDROID_HOME" >&2
            exit 1
          fi
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" --install "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mobile web app
        run: pnpm run build:mobile

      - name: Sync Capacitor Android
        run: pnpm exec cap sync android

      - name: Prepare optional production signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vocflow-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/vocflow-release.jks" >> "$GITHUB_ENV"
            echo "Release APK will use the configured VocFlow signing key."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not configured; this APK uses the Android debug key fallback."
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: bash ./gradlew assembleRelease --no-daemon

      - name: Collect Android assets
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p release-assets
          source_apk="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$source_apk"
          cp "$source_apk" "release-assets/VocFlow-${version}-android.apk"
          cd release-assets
          sha256sum "VocFlow-${version}-android.apk" > "VocFlow-${version}-android.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: android-assets
          if-no-files-found: error
          path: release-assets/*

  ios:
    name: iPhone unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mobile web app
        run: pnpm run build:mobile

      - name: Sync Capacitor iOS
        run: pnpm exec cap sync ios

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          app_path="build/Build/Products/Release-iphoneos/App.app"
          test -d "$app_path"
          mkdir -p release-assets Payload
          ditto "$app_path" "Payload/App.app"
          ditto -c -k --sequesterRsrc --keepParent Payload "release-assets/VocFlow-${version}-ios-unsigned.ipa"
          cd release-assets
          shasum -a 256 "VocFlow-${version}-ios-unsigned.ipa" > "VocFlow-${version}-ios-unsigned.ipa.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-assets
          if-no-files-found: error
          path: release-assets/*

  pwa:
    name: iPhone PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installable PWA
        run: pnpm run build:mobile

      - name: Package PWA
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p release-assets
          cd dist-mobile
          zip -qry "../release-assets/VocFlow-${version}-pwa.zip" .
          cd ../release-assets
          sha256sum "VocFlow-${version}-pwa.zip" > "VocFlow-${version}-pwa.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: pwa-assets
          if-no-files-found: error
          path: release-assets/*

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - windows
      - android
      - ios
      - pwa
    steps:
      - uses: actions/checkout@v4

      - name: Download all build assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          mapfile -d '' assets < <(find release-assets -type f -print0)
          test "${#assets[@]}" -gt 0
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "VocFlow ${version}" --generate-notes --target "$GITHUB_SHA"
          gh release upload "$tag" "${assets[@]}" --clobber
          printf 'Published %s with %s assets.\n' "$tag" "${#assets[@]}"