extraMetadata:
  buildEdition: user
appId: com.vocflow.app
productName: VocFlow
asar: false
npmRebuild: false
copyright: Copyright © 2026 VocFlow
directories:
  output: release/user-msix
win:
  target:
    - target: appx
      arch:
        - x64
  executableName: VocFlow
  legalTrademarks: VocFlow
  signAndEditExecutable: true
  icon: resources/icon.ico
appx:
  identityName: com.vocflow.app
  applicationId: VocFlow
  publisher: CN=VocFlow
  publisherDisplayName: VocFlow
  displayName: VocFlow
  description: VocFlow 英语学习与文献研读一体化工具
  languages:
    - zh-CN
    - en-US
  backgroundColor: '#171412'
  showNameOnTiles: true
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26100.0
files:
  - dist-electron
  - dist
  - resources/icon.png
  - resources/icon.ico
  - "!**/*.map"
  - "!**/*.log"
  - "!**/.env*"
  - "!**/*.pdf"
  - "!**/*.doc"
  - "!**/*.docx"
  - "!**/*.epub"
  - "!**/*.mp3"
  - "!**/*.wav"
  - "!**/*.m4a"
  - "!**/*.flac"
  - "!**/*.mp4"
  - "!**/*.mkv"
  - "!**/*.csv"
  - "!**/*.xlsx"
  - "!**/*.db"
  - "!**/*.sqlite"
  - "!**/*.sqlite3"
  - "!**/ExamLibrary/**"
  - "!**/TtsAudioCache/**"
  - "!**/local-cloud/**"
  - "!**/README*"
  - "!**/CHANGELOG*"
  - "!**/CHANGES*"
  - "!**/CONTRIBUTING*"
  - "!**/CODE_OF_CONDUCT*"
  - "!**/SECURITY*"
  - "!**/documentation_index.md"
  - "!**/node_modules/**/test/**"
  - "!**/node_modules/**/tests/**"
  - "!**/node_modules/**/__tests__/**"
  - "!**/node_modules/**/example/**"
  - "!**/node_modules/**/examples/**"
  - "!**/node_modules/pdfjs-dist/**/web/images/**"
  - "!**/node_modules/sql.js/logo.svg"
extraResources:
  - from: resources/wordbooks
    to: wordbooks
    filter:
      - manifest.json
      - cet4.json
      - cet4-core.json
      - cet6.json
      - ielts.json
      - kaoyan.json
      - toefl.json





